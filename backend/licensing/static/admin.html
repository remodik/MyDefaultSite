<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Лицензии · Панель управления</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#1a1b1e; --sidebar:#212226; --panel:#232428; --panel2:#2b2d31;
    --line:#2f3136; --line2:#26272b; --border:#3a3c42;
    --text:#e3e5e8; --text2:#c8cdd3; --muted:#8e959e;
    --accent:#5865f2; --accent2:#4752c4;
    --ok:#3dba6f; --ok2:#23a559; --warn:#f0b232; --danger:#f23f43; --danger2:#f5595d; --unlocked:#b97fd1;
    --mono:'JetBrains Mono',ui-monospace,monospace;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-size:14px;
    font-family:'Manrope',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
  a { color:#7983f5; text-decoration:none; } a:hover { color:#98a0f8; }
  ::-webkit-scrollbar { width:10px; height:10px; } ::-webkit-scrollbar-thumb { background:var(--border); border-radius:5px; }
  @keyframes toastIn { from { opacity:0; transform:translateY(8px);} to { opacity:1; transform:none;} }
  input::placeholder, textarea::placeholder { color:#6b7178; }

  h1 { margin:0; font-size:22px; font-weight:800; letter-spacing:-0.02em; }
  h2 { margin:0 0 20px; font-size:22px; font-weight:800; letter-spacing:-0.02em; }
  h3 { margin:0 0 14px; font-size:16px; font-weight:800; }
  h4 { margin:16px 0 4px; font-size:13px; font-weight:800; }
  b { font-weight:700; }
  code { font-family:var(--mono); background:var(--bg); padding:2px 7px; border-radius:6px; font-size:11.5px; color:var(--muted); }

  button { font-family:inherit; cursor:pointer; border:none; border-radius:9px; padding:9px 16px;
    font-size:13px; font-weight:700; background:var(--accent); color:#fff; transition:background .15s,border-color .15s; }
  button:hover { background:var(--accent2); }
  button:disabled { opacity:.4; cursor:default; }
  button.ghost { background:transparent; border:1px solid var(--border); color:var(--text); }
  button.ghost:hover { background:var(--panel2); border-color:var(--accent); }
  button.ok { background:var(--ok2); } button.ok:hover { background:#1e8f4c; }
  button.warn { background:var(--warn); color:var(--bg); } button.warn:hover { background:#d99e26; }
  button.danger { background:var(--danger); } button.danger:hover { background:#d6363a; }
  button.sm { padding:5px 11px; font-size:12px; border-radius:7px; }
  button.icon { display:inline-flex; align-items:center; gap:7px; }

  input, textarea, select { font-family:inherit; width:100%; background:var(--bg); color:var(--text);
    border:1px solid var(--border); border-radius:8px; padding:9px 11px; font-size:13px; }
  input:focus, textarea:focus, select:focus { outline:none; border-color:var(--accent); }
  textarea { resize:vertical; }
  .mono { font-family:var(--mono); }
  label { display:block; font-size:11px; color:var(--muted); font-weight:600; margin:10px 0 4px; }

  .row { display:flex; gap:10px; flex-wrap:wrap; }
  .row > * { flex:1; min-width:120px; }
  .flex-between { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .muted { color:var(--muted); } .small { font-size:12px; } .del { color:var(--danger2); }

  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin-bottom:14px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px; }
  .clickable { cursor:pointer; } .clickable:hover { border-color:var(--accent); }

  .pill { display:inline-block; padding:3px 9px; border-radius:12px; font-size:11px; font-weight:700; }
  .pill.active { background:rgba(35,165,89,.14); color:var(--ok); }
  .pill.suspended { background:rgba(240,178,50,.14); color:var(--warn); }
  .pill.revoked { background:rgba(242,63,67,.14); color:var(--danger2); }
  .pill.unlocked { background:rgba(155,89,182,.16); color:var(--unlocked); }
  .pill.off { background:rgba(242,63,67,.14); color:var(--danger2); }
  .pill.paid { background:rgba(35,165,89,.14); color:var(--ok); }
  .pill.pending { background:rgba(240,178,50,.14); color:var(--warn); }
  .pill.unpaid { background:rgba(88,101,242,.16); color:#7983f5; }

  table { width:100%; border-collapse:collapse; }
  th { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); color:var(--muted);
    font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.05em; }
  td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line2); font-size:12.5px; }

  .drop { border:2px dashed var(--border); border-radius:12px; padding:26px; text-align:center; color:var(--muted); transition:.15s; }
  .drop.hot { border-color:var(--accent); color:var(--text); }
  .keybox { font-family:var(--mono); background:var(--bg); padding:12px; border-radius:8px;
    word-break:break-all; border:1px solid var(--accent); font-size:13px; color:var(--text2); }
  .diff-add { background:rgba(35,165,89,.16); } .diff-del { background:rgba(242,63,67,.16); }
  /* !important: must beat #shell{display:flex} (ID) and .modal-bg{display:flex} (later rule). */
  .hidden { display:none !important; }

  /* layout */
  #shell { display:flex; height:100vh; overflow:hidden; }
  #sidebar { width:232px; flex-shrink:0; background:var(--sidebar); border-right:1px solid var(--line);
    display:flex; flex-direction:column; padding:16px 12px; }
  #scroll { flex:1; overflow:auto; padding:28px 32px; }
  #app { max-width:1100px; margin:0 auto; }
  .brand { display:flex; align-items:center; gap:10px; padding:6px 10px 18px; }
  .brand-ic { width:36px; height:36px; border-radius:10px; background:linear-gradient(135deg,#5865f2,#4752c4);
    display:grid; place-items:center; color:#fff; }
  nav { display:flex; flex-direction:column; gap:2px; }
  nav button { display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:8px;
    font-size:13.5px; font-weight:600; text-align:left; background:transparent; color:var(--muted); }
  nav button:hover { background:var(--panel2); color:var(--text); }
  nav button.on { background:var(--line); color:#fff; }
  .badge { background:var(--danger); color:#fff; font-size:10.5px; font-weight:800; border-radius:10px; padding:1px 7px; margin-left:auto; }
  .side-user { border-top:1px solid var(--line); margin-top:auto; padding:12px 6px 0 10px; display:flex; align-items:center; gap:10px; }
  .avatar { width:30px; height:30px; border-radius:50%; background:var(--border); display:grid; place-items:center;
    font-size:12px; font-weight:800; color:var(--text2); }

  .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.65); display:flex; align-items:center;
    justify-content:center; z-index:50; padding:20px; }
  .modal { background:var(--panel2); border:1px solid var(--border); border-radius:14px;
    padding:22px 24px; max-width:620px; width:100%; max-height:90vh; overflow:auto; }
  .toast { position:fixed; bottom:22px; right:22px; background:var(--panel2); border:1px solid var(--border);
    border-left:3px solid var(--accent); border-radius:10px; padding:12px 18px; z-index:100; max-width:340px;
    font-size:13px; font-weight:600; animation:toastIn .2s ease; box-shadow:0 8px 24px rgba(0,0,0,.4); }
  .toast.err { border-left-color:var(--danger); }
</style>
</head>
<body>
<!-- login -->
<div id="login" class="modal-bg">
  <div class="modal" style="max-width:380px">
    <div class="brand" style="padding-left:0">
      <div class="brand-ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path></svg></div>
      <div><div style="font-weight:800; font-size:16px;">Вход администратора</div><div class="muted small">Панель лицензий</div></div>
    </div>
    <p class="muted small" style="margin:4px 0 0;">Используется тот же аккаунт, что и на сайте (роль admin).</p>
    <label>Логин</label><input id="l-user" autocomplete="username">
    <label>Пароль</label><input id="l-pass" type="password" autocomplete="current-password">
    <div style="margin-top:16px"><button id="l-btn" style="width:100%">Войти</button></div>
    <div id="l-err" class="del small" style="margin-top:8px"></div>
  </div>
</div>

<!-- app shell -->
<div id="shell" class="hidden">
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path></svg></div>
      <div><div style="font-weight:800; font-size:15px; letter-spacing:-0.01em;">Лицензии</div><div class="muted" style="font-size:11px;">Панель управления</div></div>
    </div>
    <nav id="nav">
      <button data-view="dashboard" class="on"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>Дашборд</button>
      <button data-view="projects"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"></path></svg>Проекты</button>
      <button data-view="clients"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>Клиенты и лицензии</button>
      <button data-view="security"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1 1 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path><path d="M12 8v4"></path><path d="M12 16h.01"></path></svg><span style="flex:1">Security</span><span id="flag-badge" class="badge hidden"></span></button>
      <button data-view="logs"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13"></path><path d="M8 12h13"></path><path d="M8 18h13"></path><path d="M3 6h.01"></path><path d="M3 12h.01"></path><path d="M3 18h.01"></path></svg>Логи доступа</button>
    </nav>
    <!-- Адрес, который вы даёте клиенту: он входит туда своим лицензионным ключом. -->
    <a href="/licensing/portal" target="_blank" style="display:flex; align-items:center; gap:10px; margin-top:14px;
       padding:9px 10px; border-radius:8px; font-size:12.5px; font-weight:600; color:var(--muted); border:1px dashed var(--border);">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
      Кабинет клиента
    </a>
    <div class="side-user">
      <div class="avatar" id="user-initial">A</div>
      <div style="flex:1; min-width:0;"><div id="user-name" style="font-size:12.5px; font-weight:700;">admin</div><div class="muted" style="font-size:11px;">admin</div></div>
      <button id="logout" title="Выйти" class="ghost" style="padding:6px; border:none; background:transparent; color:var(--muted);"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg></button>
    </div>
  </aside>
  <main id="scroll"><div id="app"></div></main>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script>
const API = "/api/v1/licensing/admin";
const TOKEN_KEY = "licensing_admin_token";
const USER_KEY = "licensing_admin_user";
let token = localStorage.getItem(TOKEN_KEY) || "";

// small feather-icon helpers
const IC = {
  plus: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>',
  back: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>',
  copy: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>',
  chevL: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>',
  chevR: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>',
  ok: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#3dba6f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>',
  x: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18"></path><path d="M6 6l12 12"></path></svg>',
  upload: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#6b7178" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>',
};

// ---- api helpers ----
async function api(path, opts = {}) {
  const headers = Object.assign({ "Authorization": "Bearer " + token }, opts.headers || {});
  if (opts.body && !(opts.body instanceof FormData)) {
    headers["Content-Type"] = "application/json";
    opts.body = JSON.stringify(opts.body);
  }
  const res = await fetch(API + path, Object.assign({}, opts, { headers }));
  if (res.status === 401 || res.status === 403) { logout(); throw new Error("Не авторизован"); }
  if (res.status === 204) return null;
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || ("HTTP " + res.status));
  return data;
}
function toast(msg, err = false) {
  const t = document.createElement("div");
  t.className = "toast" + (err ? " err" : "");
  t.textContent = msg;
  document.getElementById("toast-root").appendChild(t);
  setTimeout(() => t.remove(), 3500);
}
function esc(s) { return (s ?? "").toString().replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function fmtDate(s) { return s ? new Date(s).toLocaleString() : "—"; }
function pill(status) { return `<span class="pill ${status}">${status}</span>`; }
const PAY_LABEL = { none: "без оплаты", unpaid: "ждёт оплаты", pending: "заявлена оплата", paid: "оплачено" };
function payPill(l) {
  if (!l.payment_status || l.payment_status === "none") return "";
  return `<span class="pill ${l.payment_status}">${PAY_LABEL[l.payment_status]}</span>`;
}
function money(amount, currency) {
  if (amount === null || amount === undefined) return "—";
  return new Intl.NumberFormat("ru-RU").format(amount) + " " + (currency === "RUB" ? "₽" : esc(currency));
}
function setFlagBadge(n) {
  const b = document.getElementById("flag-badge");
  if (!b) return;
  if (n > 0) { b.textContent = n; b.classList.remove("hidden"); } else b.classList.add("hidden");
}

// ---- modal ----
function modal(html) {
  const root = document.getElementById("modal-root");
  root.innerHTML = `<div class="modal-bg"><div class="modal">${html}</div></div>`;
  root.querySelector(".modal-bg").addEventListener("click", e => { if (e.target.classList.contains("modal-bg")) closeModal(); });
}
function closeModal() { document.getElementById("modal-root").innerHTML = ""; }

// ---- auth ----
async function login() {
  const username = document.getElementById("l-user").value.trim();
  const password = document.getElementById("l-pass").value;
  document.getElementById("l-err").textContent = "";
  try {
    const res = await fetch("/api/auth/login", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password }) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Ошибка входа");
    if ((data.user || {}).role !== "admin") throw new Error("Требуется учётная запись администратора");
    token = data.access_token; localStorage.setItem(TOKEN_KEY, token);
    localStorage.setItem(USER_KEY, (data.user || {}).username || "admin");
    boot();
  } catch (e) { document.getElementById("l-err").textContent = e.message; }
}
function logout() {
  token = ""; localStorage.removeItem(TOKEN_KEY);
  document.getElementById("shell").classList.add("hidden");
  document.getElementById("login").classList.remove("hidden");
}
function boot() {
  const name = localStorage.getItem(USER_KEY) || "admin";
  document.getElementById("user-name").textContent = name;
  document.getElementById("user-initial").textContent = (name[0] || "A").toUpperCase();
  document.getElementById("login").classList.add("hidden");
  document.getElementById("shell").classList.remove("hidden");
  navigate("dashboard");
}

// ---- navigation ----
const views = {};
function navigate(name, arg) {
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.view === name));
  (views[name] || views.dashboard)(arg);
}

// ================= DASHBOARD =================
views.dashboard = async () => {
  const app = document.getElementById("app");
  app.innerHTML = `<h1 style="margin-bottom:20px">Дашборд</h1><div id="dash" class="muted">Загрузка…</div>`;
  try {
    const [d, claims] = await Promise.all([api("/dashboard"), api("/licenses?payment_status=pending")]);
    const totals = { active: 0, suspended: 0, revoked: 0, unlocked: 0 };
    d.projects.forEach(p => { totals.active += p.active; totals.suspended += p.suspended; totals.revoked += p.revoked; totals.unlocked += p.unlocked; });
    const stat = (label, value, color) => `<div class="card" style="margin:0">
      <div class="flex-between"><span class="muted small" style="font-weight:600">${label}</span>
      <span style="width:8px;height:8px;border-radius:50%;background:${color}"></span></div>
      <div style="font-size:26px;font-weight:800;margin-top:6px;color:${color}">${value}</div></div>`;
    const cards = `<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px">
      ${stat("Активные", totals.active, "var(--ok)")}${stat("Приостановлены", totals.suspended, "var(--warn)")}
      ${stat("Отозваны", totals.revoked, "var(--danger2)")}${stat("Unlocked", totals.unlocked, "var(--unlocked)")}</div>`;
    const proj = `<div class="grid" style="margin-bottom:20px">${d.projects.map(p => `
      <div class="card" style="margin:0"><div class="flex-between"><b>${esc(p.name)}</b><code>${esc(p.slug)}</code></div>
      <div class="row" style="margin-top:12px;gap:6px">
        <span class="pill active" style="flex:0">${p.active} актив.</span><span class="pill suspended" style="flex:0">${p.suspended} приост.</span>
        <span class="pill revoked" style="flex:0">${p.revoked} отозв.</span><span class="pill unlocked" style="flex:0">${p.unlocked} unlocked</span>
      </div></div>`).join("") || `<p class="muted">Пока нет проектов.</p>`}</div>`;
    // Клиенты, заявившие об оплате: требуют вашей ручной проверки, поэтому
    // висят наверху дашборда, а не прячутся в списке лицензий.
    const claimsHtml = claims.length ? `<div class="card" style="border-color:var(--warn)">
      <div class="flex-between" style="justify-content:flex-start;gap:8px;margin-bottom:10px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f0b232" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"></rect><path d="M2 10h20"></path></svg>

function setupDrop(projectId) {
  const drop = document.getElementById("drop");
  const fi = document.getElementById("fi"), fd = document.getElementById("fd");
  const handle = files => collectFiles(files, projectId);
  ["dragenter","dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("hot"); }));
  ["dragleave","drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("hot"); }));
  drop.addEventListener("drop", async e => {
    const items = e.dataTransfer.items;
    if (items && items[0] && items[0].webkitGetAsEntry) {
      const out = []; await Promise.all([...items].map(it => walkEntry(it.webkitGetAsEntry(), "", out)));
      uploadCollected(out, projectId);
    } else { handle(e.dataTransfer.files); }
  });
  fi.addEventListener("change", () => handle(fi.files));
  fd.addEventListener("change", () => handle(fd.files));
}
function walkEntry(entry, path, out) {
  return new Promise(resolve => {
    if (!entry) return resolve();
    if (entry.isFile) entry.file(f => { out.push({ file: f, path: (path + f.name) }); resolve(); });
    else if (entry.isDirectory) {
      const reader = entry.createReader();
      reader.readEntries(async entries => {
        await Promise.all(entries.map(e => walkEntry(e, path + entry.name + "/", out)));
        resolve();
      });
    } else resolve();
  });
}
async function collectFiles(fileList, projectId) {
  const out = [];
  for (const f of fileList) out.push({ file: f, path: f.webkitRelativePath || f.name });
  uploadCollected(out, projectId);
}
async function uploadCollected(items, projectId) {
  const py = items.filter(i => i.path.endsWith(".py"));
  if (!py.length) return toast("Нет .py файлов", true);
  try {
    const files = await Promise.all(py.map(async i => {
      let rp = i.path.replace(/\\/g, "/").replace(/^\/+/, "");
      return { relative_path: rp, content: await i.file.text() };
    }));
    await api(`/projects/${projectId}/files`, { method: "POST", body: { files } });
    toast(`Загружено файлов: ${files.length}`); openProject(projectId);
  } catch (e) { toast(e.message, true); }
}

    : `<div class="row" style="margin-top:12px">
         <button class="ok sm" onclick="confirmPay(${l.id})">Подтвердить оплату и выдать</button>
         ${l.payment_status === "pending"
            ? `<button class="ghost sm" onclick="rejectPay(${l.id})">Отклонить заявку</button>` : ""}
       </div>`;

  return `<h4>Оплата <span style="margin-left:6px">${payPill(l)}</span></h4>
    <p class="small muted" style="margin:0 0 8px">
      Видно клиенту в личном кабинете. Пустая цена — платить нечего.</p>
    ${claimed}
    <div class="row">
      <div style="flex:2"><label style="margin-top:0">Цена (целое, ${esc(l.price_currency || "RUB")})</label>
        <input id="pay-amount" type="number" min="0" step="1" value="${l.price_amount ?? ""}" placeholder="напр. 15000"></div>
      <div style="flex:1"><label style="margin-top:0">Валюта</label>
        <input id="pay-currency" value="${esc(l.price_currency || "RUB")}" maxlength="3"></div>
    </div>
    <label>Реквизиты для клиента</label>
    <textarea id="pay-instructions" rows="3" placeholder="СБП +7 ..., комментарий к платежу">${esc(l.payment_instructions || "")}</textarea>
    <div class="row" style="margin-top:10px"><button class="ghost sm" onclick="savePrice(${l.id})">Сохранить цену</button></div>
    ${actions}`;
}
async function savePrice(id) {
  const raw = document.getElementById("pay-amount").value.trim();
  try {
    await api(`/licenses/${id}/price`, { method: "PATCH", body: {
      price_amount: raw === "" ? null : Number(raw),
      price_currency: document.getElementById("pay-currency").value.trim().toUpperCase() || "RUB",
      payment_instructions: document.getElementById("pay-instructions").value.trim() || null } });
    toast("Цена сохранена"); manageLicense(id); views.clients();
  } catch (e) { toast(e.message, true); }
}
async function confirmPay(id) {
  if (!confirm("Подтвердить оплату и выдать код навсегда?\n\nСтатус станет unlocked — это необратимо: приостановить или отозвать такую лицензию уже нельзя.")) return;
  try { await api(`/licenses/${id}/payment/confirm`, { method: "POST", body: { unlock: true, note: null } });
    toast("Оплата подтверждена, доступ выдан"); manageLicense(id); views.clients(); } catch (e) { toast(e.message, true); }
}
async function rejectPay(id) {
  if (!confirm("Отклонить заявку об оплате? Клиент снова увидит счёт.")) return;
  try { await api(`/licenses/${id}/payment/reject`, { method: "POST" });
    toast("Заявка отклонена"); manageLicense(id); views.clients(); } catch (e) { toast(e.message, true); }
}

async function setStatus(id, status) {
  try { await api(`/licenses/${id}/status`, { method: "PATCH", body: { status } });
    toast("Статус: " + status); manageLicense(id); views.clients(); } catch (e) { toast(e.message, true); }
}
async function revokeLic(id) {
  if (!confirm("Отозвать лицензию? Это необратимо — доступ прекратится немедленно.")) return;
  await setStatus(id, "revoked");
}
async function unlockLic(id) {
  if (!confirm("Выдать код навсегда?\n\nunlocked — финальный статус: лицензия перестаёт проверяться, а приостановить или отозвать её потом будет нельзя.")) return;
  await setStatus(id, "unlocked");
}
async function extendLic(id) {
  try { await api(`/licenses/${id}/extend`, { method: "PATCH", body: { plan: document.getElementById("ext-plan").value } });
    toast("Обновлено"); manageLicense(id); } catch (e) { toast(e.message, true); }
}
async function setModule(licId, fileId, enabled) {
  try { await api(`/licenses/${licId}/modules`, { method: "PATCH", body: { project_file_id: fileId, is_enabled: enabled } });
    manageLicense(licId); } catch (e) { toast(e.message, true); }
}
async function clearModule(licId, fileId) {
  try { await api(`/licenses/${licId}/modules/${fileId}`, { method: "DELETE" }); manageLicense(licId); }
  catch (e) { toast(e.message, true); }
}

// ================= SECURITY EVENTS =================
views.security = async () => {
  const app = document.getElementById("app");
  app.innerHTML = `<h1 style="margin-bottom:6px">Security events</h1>
    <p class="muted small" style="margin:0 0 20px">Автоматические срабатывания kill-switch. Подтвердите revoke или снимите подозрение.</p>
    <div id="sec" class="muted">Загрузка…</div>`;
  try {
    const events = await api("/security-events");
    document.getElementById("sec").innerHTML = events.map(e => `
      <div class="card" style="border-left:3px solid ${e.resolved ? 'var(--border)' : 'var(--danger)'};display:flex;align-items:center;gap:16px">
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
            <span class="pill suspended mono">${esc(e.flag_type)}</span>
            <span class="mono small">#${e.license_id} <span class="muted">…${esc(e.license_last4)||""}</span></span>
            <span class="muted small">${fmtDate(e.detected_at)}</span></div>
          <div class="small" style="color:var(--text2);margin-top:6px">${esc(e.details)||""} <span class="muted">· авто-действие: ${esc(e.auto_action)||"—"}</span></div>
        </div>
        ${e.resolved
          ? `<span class="muted small" style="display:inline-flex;align-items:center;gap:6px;flex-shrink:0">${IC.ok}${esc(e.resolution)||""}</span>`
          : `<div style="display:flex;gap:8px;flex-shrink:0">
              <button class="danger sm" onclick="resolveEvent(${e.id},'revoke')">Revoke</button>
              <button class="ghost sm" onclick="resolveEvent(${e.id},'dismiss')">Снять</button></div>`}
      </div>`).join("") || `<p class="muted">Событий нет.</p>`;
    setFlagBadge(events.filter(e => !e.resolved).length);
  } catch (e) { toast(e.message, true); }
};
async function resolveEvent(id, resolution) {
  if (resolution === "revoke" && !confirm("Отозвать лицензию?")) return;
  try { await api(`/security-events/${id}`, { method: "PATCH", body: { resolution } });
    toast(resolution === "revoke" ? "Лицензия отозвана" : "Подозрение снято"); views.security(); }
  catch (e) { toast(e.message, true); }
}

// ================= ACCESS LOGS =================
let logState = { offset: 0, limit: 100 };
views.logs = async () => {
  const app = document.getElementById("app");
  app.innerHTML = `<h1 style="margin-bottom:20px">Логи доступа</h1>
    <div class="card"><div class="row" style="align-items:flex-end">
      <div><label>Проект ID</label><input id="lf-proj" type="number"></div>
      <div><label>Лицензия ID</label><input id="lf-lic" type="number"></div>
      <div><label>Итог</label><select id="lf-succ"><option value="">все</option>
        <option value="true">успех</option><option value="false">отказ</option></select></div>
      <div><label>С даты</label><input id="lf-from" type="date"></div>
      <div><label>По дату</label><input id="lf-to" type="date"></div>
      <div style="flex:0"><button onclick="logState.offset=0;loadLogs()">Фильтр</button></div>
    </div></div><div id="logs" class="muted">Загрузка…</div>`;
  loadLogs();
};
async function loadLogs() {
  const q = new URLSearchParams();
  const proj = document.getElementById("lf-proj")?.value, lic = document.getElementById("lf-lic")?.value;
  const succ = document.getElementById("lf-succ")?.value, from = document.getElementById("lf-from")?.value, to = document.getElementById("lf-to")?.value;
  if (proj) q.set("project_id", proj); if (lic) q.set("license_id", lic);
  if (succ) q.set("success", succ);
  if (from) q.set("date_from", from + "T00:00:00"); if (to) q.set("date_to", to + "T23:59:59");
  q.set("limit", logState.limit); q.set("offset", logState.offset);
  try {
    const d = await api("/logs?" + q.toString());
    document.getElementById("logs").innerHTML = `<div class="card">
      <div class="flex-between" style="margin-bottom:6px"><b>Записей: ${d.total}</b>
        <div style="display:flex;align-items:center;gap:8px"><button class="ghost sm" onclick="pageLogs(-1)" ${logState.offset<=0?"disabled":""}>${IC.chevL}</button>
        <span class="muted small">${d.total ? logState.offset+1 : 0}–${Math.min(logState.offset+logState.limit, d.total)}</span>
        <button class="ghost sm" onclick="pageLogs(1)" ${logState.offset+logState.limit>=d.total?"disabled":""}>${IC.chevR}</button></div></div>
      <table><thead><tr><th>Время</th><th>Лиц.</th><th>Режим</th><th>Entrypoint</th><th>IP</th><th>FP</th><th>Итог</th><th>Причина</th></tr></thead>
      <tbody>${d.items.map(r => `<tr>
        <td class="muted">${fmtDate(r.requested_at)}</td><td class="mono">${r.license_id ?? (r.attempted_key_last4?("…"+esc(r.attempted_key_last4)):"—")}</td>
        <td>${esc(r.mode)||"—"}</td><td class="mono" style="color:var(--text2)">${esc(r.entrypoint)||"—"}</td>
        <td class="muted">${esc(r.ip_address)||"—"}</td><td class="mono muted">${(esc(r.hardware_fingerprint)||"").slice(0,8)}</td>
        <td>${r.success ? IC.ok : `<span class="del">${IC.x}</span>`}</td><td style="color:var(--text2)">${esc(r.reason)||""}</td></tr>`).join("")}</tbody></table></div>`;
  } catch (e) { toast(e.message, true); }
}
function pageLogs(dir) { logState.offset = Math.max(0, logState.offset + dir * logState.limit); loadLogs(); }

// ---- wire up ----
document.getElementById("l-btn").addEventListener("click", login);
document.getElementById("l-pass").addEventListener("keydown", e => { if (e.key === "Enter") login(); });
document.getElementById("logout").addEventListener("click", logout);
document.getElementById("nav").addEventListener("click", e => {
  const btn = e.target.closest("button[data-view]");
  if (btn) navigate(btn.dataset.view);
});
if (token) boot();
</script>
