<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>remod3</title>
        <link rel="icon" href="/assets/images/favicon.ico" type="image/x-icon" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800;900&display=swap"
            rel="stylesheet"
        />

        <link rel="stylesheet" href="/assets/css/ide.css" />
        <link rel="stylesheet" href="/assets/css/app.css" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.css"
        />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        />
        <link rel="stylesheet" href="/assets/css/design-fixes.css" />
    </head>
    <body class="ide-host">
        <div class="v1-root" id="ide-root">
            <div class="v1-titlebar">
                <button
                    class="v1-sidebar-toggle"
                    id="ide-sidebar-toggle"
                    aria-controls="ide-sidebar"
                    aria-expanded="false"
                    data-i18n-aria-label="sidebar_toggle"
                    aria-label="Показать или скрыть боковую панель"
                >
                    <i class="fas fa-bars"></i>
                </button>
                <div class="v1-title" id="ide-title">remod3 — index.js</div>
                <div class="v1-title-right">
                    <div class="v1-lang" id="ide-lang"></div>
                </div>
            </div>

            <div class="v1-body">
                <div class="v1-activity">
                    <button
                        class="v1-act-btn active"
                        id="ide-act-explorer"
                        aria-controls="ide-sidebar"
                        aria-expanded="true"
                        title="Проводник"
                        data-i18n-title="act_explorer"
                        data-i18n-aria-label="act_explorer"
                        aria-label="Проводник"
                    >
                        <i class="fas fa-folder"></i>
                    </button>
                    <div style="flex: 1"></div>
                    <button
                        class="v1-act-btn"
                        id="ide-act-account"
                        title="Аккаунт"
                        data-i18n-title="act_account"
                        data-i18n-aria-label="act_account"
                        aria-label="Аккаунт"
                    >
                        <i class="fas fa-user"></i>
                    </button>
                    <button
                        class="v1-act-btn"
                        id="ide-act-settings"
                        title="Настройки"
                        data-i18n-title="act_settings"
                        data-i18n-aria-label="act_settings"
                        aria-label="Настройки"
                    >
                        <i class="fas fa-cog"></i>
                    </button>
                </div>

                <aside class="v1-sidebar" id="ide-sidebar"></aside>

                <div class="v1-editor">
                    <div class="v1-tabs" id="ide-tabs"></div>
                    <div class="v1-breadcrumb" id="ide-breadcrumb"></div>
                    <div id="wake-banner" class="v1-wake hidden">
                        <svg
                            class="animate-spin"
                            width="14"
                            height="14"
                            xmlns="http://www.w3.org/2000/svg"
                            fill="none"
                            viewBox="0 0 24 24"
                            style="flex-shrink: 0"
                        >
                            <circle
                                class="opacity-25"
                                cx="12"
                                cy="12"
                                r="10"
                                stroke="currentColor"
                                stroke-width="4"
                            ></circle>
                            <path
                                class="opacity-75"
                                fill="currentColor"
                                d="M4 12a8 8 0 018-8v8z"
                            ></path>
                        </svg>
                        <span id="wake-banner-text" data-i18n="wake_msg"></span>
                    </div>
                    <div class="v1-page" id="ide-page">
                        <div class="v1-page-content">
                            <main id="app"></main>
                            <footer class="v1-page-footer">
                                <span id="footer-rights" data-i18n="footer_rights"></span>
                                <a href="/privacy" id="footer-privacy" data-i18n="footer_privacy"></a>
                                <a href="/terms" id="footer-terms" data-i18n="footer_terms"></a>
                            </footer>
                        </div>
                    </div>
                </div>
            </div>

            <div class="v1-status">
                <span class="v1-st-item"
                    ><i class="fas fa-code-branch" aria-hidden="true"></i> master</span
                >
                <span class="v1-st-spacer"></span>
                <span class="v1-st-item">UTF-8</span>
                <span class="v1-st-item" id="st-filetype" hidden></span>
                <span class="v1-st-item v1-st-online">
                    <span class="v1-st-dot" id="st-online-dot" aria-hidden="true">●</span>
                    <span id="st-online" data-i18n="st_connecting"></span>
                </span>
            </div>
        </div>

        <div id="modal-container"></div>
        <div id="toast-container" role="status" aria-live="polite"></div>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markup.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-jsx.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-tsx.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-typescript.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-docker.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-toml.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-ini.min.js"></script>
        <script>
            window.APP_CONFIG = {
                API_URL: (function () {
                    const host = window.location.hostname;
                    const protocol = window.location.protocol;
                    if (
                        host === "localhost" ||
                        host === "127.0.0.1" ||
                        /^\d+\.\d+\.\d+\.\d+$/.test(host)
                    ) {
                        return `${protocol}//${host}:8001`;
                    }
                    // Backend переехал с Render (засыпающий Hobby-план,
                    // сервис там сейчас Suspended) на Pterodactyl-хост бота —
                    // третий процесс run.py, публикуется через Cloudflare
                    // Tunnel как licensing.remod3.ru.
                    return "https://licensing.remod3.ru";
                })(),
                GOOGLE_CLIENT_ID: "REPLACE_WITH_YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com",
            };
        </script>
        <script src="https://accounts.google.com/gsi/client" async defer></script>

        <script type="importmap">
            {
                "imports": {
                    "@pierre/trees": "https://esm.sh/@pierre/trees@1.0.0-beta.4"
                }
            }
        </script>
        <script type="module" src="/assets/js/app.js"></script>
    </body>
</html>
