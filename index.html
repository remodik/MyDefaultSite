        <link rel="stylesheet" href="/assets/css/ide.css" />

    <body class="ide-host bg-discord-darker text-discord-text">
        <div class="v1-root" id="ide-root">

                    <i style="background: #28c840"></i>

                <button
                    class="v1-sidebar-toggle"
                    id="ide-sidebar-toggle"
                    aria-label="Toggle sidebar"
                >
                    <i class="fas fa-bars"></i>
                </button>
                <div class="v1-title" id="ide-title">remod3 — index.tsx</div>
                <div class="v1-title-right">
                    <div class="v1-lang" id="ide-lang"></div>
                </div>
            </div>

            <div class="v1-body">
                <div class="v1-activity">
                    <button class="v1-act-btn active" title="Explorer">
                        <i class="fas fa-folder"></i>
                    </button>
                    <button class="v1-act-btn" title="Search">
                        <i class="fas fa-search"></i>
                    </button>
                    <button class="v1-act-btn" title="Git">

                    </button>
                    <button class="v1-act-btn" title="Debug">

                    </button>
                    <button class="v1-act-btn" title="Extensions">

                    <div style="flex: 1"></div>

                    <button class="v1-act-btn" title="Settings" id="ide-act-settings">

                    </button>
                </div>

                <div class="v1-editor">
                    <div class="v1-tabs" id="ide-tabs"></div>
                    <div class="v1-breadcrumb" id="ide-breadcrumb"></div>
                    <div id="wake-banner" class="v1-wake hidden">
                        <svg
                            class="animate-spin"
                            width="14"
                            height="14"
                            xmlns="http://www.w3.org/2000/svg"
                            fill="none"
                            viewBox="0 0 24 24"
                            style="flex-shrink: 0"
                        >
                            <circle
                                class="opacity-25"
                                cx="12"
                                cy="12"
                                r="10"
                                stroke="currentColor"
                                stroke-width="4"
                            ></circle>
                            <path
                                class="opacity-75"
                                fill="currentColor"
                                d="M4 12a8 8 0 018-8v8z"
                            ></path>
                        </svg>
                        <span id="wake-banner-text">Сервер просыпается, подождите немного…</span>
                    </div>
                    <div class="v1-page" id="ide-page">
                        <div class="v1-page-content">
                            <main id="app"></main>
                            <footer class="v1-page-footer">
                                <span id="footer-rights">© 2026 Головкин И. М. · ИНН 526110332609</span>
                                <a href="/privacy" id="footer-privacy">Политика конфиденциальности</a>
                                <a href="/terms" id="footer-terms">Пользовательское соглашение</a>
                            </footer>
                        </div>
                    </div>
                </div>
            </div>

            <div class="v1-status">
                <span class="v1-st-item"><i class="fas fa-code-branch"></i> <span id="st-branch">main</span></span>
                <span class="v1-st-item"><i class="fas fa-check"></i> 0</span>
                <span class="v1-st-item"><i class="fas fa-times"></i> 0</span>
                <span class="v1-st-spacer"></span>
                <span class="v1-st-item">UTF-8</span>
                <span class="v1-st-item">LF</span>
                <span class="v1-st-item" id="st-filetype">TSX</span>
                <span class="v1-st-item">Python 3.11</span>
                <span class="v1-st-item v1-st-online"><span style="color:#86efac">●</span> <span id="st-online">Connected</span></span>

        <div id="modal-container"></div>
        <div
            id="toast-container"
            class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"
        ></div>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markup.min.js"></script>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-docker.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-toml.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-ini.min.js"></script>
        <script>
            window.APP_CONFIG = {
                API_URL: (function () {
                    const host = window.location.hostname;
                    const protocol = window.location.protocol;
                    if (
                        host === "localhost" ||
                        host === "127.0.0.1" ||
                        /^\d+\.\d+\.\d+\.\d+$/.test(host)
                    ) {
                        return `${protocol}//${host}:8001`;
                    }
                    return "https://mycardsite-backend.onrender.com";
                })(),
            };
        </script>

        <script type="importmap">
            {
                "imports": {
                    "@pierre/trees": "https://esm.sh/@pierre/trees@1.0.0-beta.4"
                }
            }
        </script>
        <script type="module" src="/assets/js/app.js"></script>
